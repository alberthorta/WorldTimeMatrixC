[env:matrixportal_s3]
platform = espressif32
board = adafruit_matrixportal_esp32s3
framework = arduino

monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/cu.usbmodem101
monitor_port = /dev/cu.usbmodem101

board_build.partitions = partitions_ota.csv
board_build.filesystem = littlefs

extra_scripts = pre:scripts/version.py

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Pinea la service task de AsyncTCP a core 0 (junto con WiFi/lwIP) para
    ; descongestionar core 1 (donde corre el render y weatherTask).
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCONFIG_ASYNC_TCP_QUEUE_SIZE=64
    ; Sin task WDT en la service task de AsyncTCP: los handlers de force-fetch
    ; (TIO/WAP) hacen HTTPS bloqueante con timeout 8s, que excede los 5s
    ; default del WDT y provoca panic+reset en RSSI marginal. La WiFi/lwIP
    ; siguen monitorizadas por sus propios WDTs.
    -DCONFIG_ASYNC_TCP_USE_WDT=0

lib_deps =
    bblanchon/ArduinoJson@^7
    mathieucarbou/ESPAsyncWebServer@^3
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3
    adafruit/Adafruit GFX Library@^1
    ; Jitter: raton BLE HID + servicio de control. NimBLE es mas ligero que
    ; Bluedroid (~importante por la RAM que ya consumen HUB75-DMA + WiFi +
    ; AsyncWebServer). 1.4.x = rama estable sobre arduino-esp32 2.0.17 / IDF 4.4.
    h2zero/NimBLE-Arduino@^1.4.3

[env:ota]
extends = env:matrixportal_s3
upload_protocol = espota
upload_port = 192.168.53.62
upload_flags =
    --auth=matrix
